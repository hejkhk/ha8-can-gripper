name: Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile HA8_UpperComputer.py ha8_protocol.py ha8_serial.py grip_estimator.py grip_panel.py auto_grip_panel.py pressure_validation.py pressure_protocol.py grip_force_calibration.py calibration_capture.py pressure_lab_panel.py serial_device_discovery.py
          xvfb-run -a python -m unittest discover -s tests -v
          python -m unittest discover -s extensions/gripper-pressure-f103/tests -v